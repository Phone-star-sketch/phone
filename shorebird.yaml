# Shorebird Configuration
# هذا الملف يتحكم في إعدادات Shorebird للتحديثات التلقائية

# App ID - سيتم إنشاؤه تلقائياً عند أول release
# تم حذف app_id: لأن Shorebird سينشئه تلقائياً

# تعطيل التحديث التلقائي الصامت
# نريد التحكم اليدوي عبر الكود لعرض dialog للمستخدم
auto_update: false

# ملاحظات:
# - عند تعيين auto_update: false، التطبيق لن يحمل التحديثات تلقائياً
# - سنستخدم shorebird_code_push package للتحكم اليدوي
# - هذا يتيح لنا عرض dialog للمستخدم قبل التحديث
