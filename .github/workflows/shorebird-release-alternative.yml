name: Shorebird Release (Alternative)

# هذا workflow بديل يستخدم manual installation
# استخدمه إذا فشل الـ workflow الرئيسي بسبب مشاكل الشبكة

on:
  workflow_dispatch:  # يمكن تشغيله يدوياً
  push:
    tags:
      - 'v*-alt'  # استخدم -alt للتمييز
      - 'patch-*-alt'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      # Configure git for better network handling
      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 0
      
      # Manual Shorebird installation with retry
      - name: Install Shorebird (with retry)
        run: |
          max_attempts=3
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            
            if curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash; then
              echo "✅ Shorebird installed successfully!"
              break
            else
              echo "❌ Attempt $attempt failed"
              if [ $attempt -eq $max_attempts ]; then
                echo "Failed after $max_attempts attempts"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done
      
      - name: Add Shorebird to PATH
        run: echo "$HOME/.shorebird/bin" >> $GITHUB_PATH
      
      - name: Verify Shorebird Installation
        run: shorebird --version
      
      - name: Shorebird Login
        run: shorebird login:ci
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: Get dependencies
        run: flutter pub get
      
      # Check if it's a patch or full release
      - name: Determine build type
        id: build_type
        run: |
          if [[ $GITHUB_REF == refs/tags/patch-* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
      
      # Full release
      - name: Shorebird Release
        if: steps.build_type.outputs.type == 'release'
        run: |
          # Shorebird automatically creates app if app_id is empty
          echo "Building release..."
          shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Patch
      - name: Shorebird Patch
        if: steps.build_type.outputs.type == 'patch'
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Upload APK (only for full releases)
      - name: Upload APK
        if: steps.build_type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      # Create GitHub Release (only for full releases)
      - name: Create Release
        if: steps.build_type.outputs.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
