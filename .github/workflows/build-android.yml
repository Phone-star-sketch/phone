name: Build Android APK

on:
  push:
    branches: [ main, ramy/updates ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create .env file
      run: |
        echo "SUPABASE_URL=https://kmtimujsqhpltmzrycxw.supabase.co" > .env
        echo "SUPABASE_ANON_KEY=placeholder" >> .env
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Analyze code
      run: flutter analyze --no-fatal-infos
      continue-on-error: true
    
    - name: Build Beta APK
      run: flutter build apk --release --no-tree-shake-icons
    
    - name: Rename Beta APK
      run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-beta-release.apk
    
    - name: Upload Beta APK
      uses: actions/upload-artifact@v4
      with:
        name: app-beta-release
        path: build/app/outputs/flutter-apk/app-beta-release.apk
        retention-days: 7
    
    # Build Production Version
    - name: Restore Production Config
      run: |
        # Change package name back to production
        sed -i 's/com.foe.phone_system_app.beta/com.foe.phone_system_app/g' android/app/build.gradle
        sed -i 's/Phone System Beta/Phone System/g' android/app/src/main/AndroidManifest.xml
    
    - name: Clean build
      run: flutter clean && flutter pub get
    
    - name: Build Production APK
      run: flutter build apk --release --no-tree-shake-icons
    
    - name: Upload Production APK
      uses: actions/upload-artifact@v4
      with:
        name: app-production-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
