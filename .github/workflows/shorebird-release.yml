name: Shorebird Release

on:
  push:
    tags:
      - 'v*'  # للـ releases الكاملة
      - 'patch-*'  # للـ patches

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # Shorebird يدعم 3.24.0
      
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        # Retry on network failures
        continue-on-error: true
        id: shorebird_setup_attempt1
      
      - name: Retry Setup Shorebird (if first attempt failed)
        if: steps.shorebird_setup_attempt1.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        continue-on-error: true
        id: shorebird_setup_attempt2
      
      - name: Final Retry Setup Shorebird (if second attempt failed)
        if: steps.shorebird_setup_attempt2.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      
      - name: Verify Shorebird Installation
        run: shorebird --version
      
      - name: Shorebird Login
        run: shorebird login:ci
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: Get dependencies
        run: flutter pub get
      
      # Check if it's a patch or full release
      - name: Determine build type
        id: build_type
        run: |
          if [[ $GITHUB_REF == refs/tags/patch-* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
      
      # Full release
      - name: Shorebird Release
        if: steps.build_type.outputs.type == 'release'
        run: |
          # Shorebird automatically creates app if app_id is empty
          echo "Building release..."
          shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Patch
      - name: Shorebird Patch
        if: steps.build_type.outputs.type == 'patch'
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Upload APK (only for full releases)
      - name: Upload APK
        if: steps.build_type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      # Create GitHub Release (only for full releases)
      - name: Create Release
        if: steps.build_type.outputs.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
