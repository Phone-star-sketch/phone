name: Shorebird Release

on:
  push:
    tags:
      - 'v*'  # للـ releases الكاملة
      - 'patch-*'  # للـ patches

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # Shorebird يدعم 3.24.0
      
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        # Retry on network failures
        continue-on-error: true
        id: shorebird_setup_attempt1
      
      - name: Retry Setup Shorebird (if first attempt failed)
        if: steps.shorebird_setup_attempt1.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        continue-on-error: true
        id: shorebird_setup_attempt2
      
      - name: Final Retry Setup Shorebird (if second attempt failed)
        if: steps.shorebird_setup_attempt2.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      
      - name: Verify Shorebird Installation
        run: shorebird --version
      
      - name: Shorebird Login
        run: shorebird login:ci
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: Get dependencies
        run: flutter pub get
      
      # Check app_id status
      - name: Check Shorebird App ID
        run: |
          echo "📋 Checking shorebird.yaml..."
          cat shorebird.yaml
          echo ""
          
          if grep -q "PLACEHOLDER_APP_ID" shorebird.yaml; then
            echo "⚠️ app_id is PLACEHOLDER - will be created automatically"
          elif grep -q "^app_id:" shorebird.yaml && ! grep -q "^# app_id:" shorebird.yaml; then
            APP_ID=$(grep "^app_id:" shorebird.yaml | cut -d' ' -f2)
            echo "✅ Using existing app_id: $APP_ID"
          else
            echo "⚠️ app_id not set - will be created automatically"
          fi
          echo ""
      
      # Check if it's a patch or full release
      - name: Determine build type
        id: build_type
        run: |
          if [[ $GITHUB_REF == refs/tags/patch-* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
      
      # Full release
      - name: Shorebird Release
        if: steps.build_type.outputs.type == 'release'
        run: |
          echo "🚀 Starting Shorebird Release..."
          echo "📱 App: phone_system_app"
          echo "🔧 Flutter Version: 3.24.0"
          echo "📦 Build Type: Release"
          echo ""
          
          # Check if we need to create app
          if grep -q "PLACEHOLDER_APP_ID" shorebird.yaml; then
            echo "📱 First release - will create app automatically"
            EXTRA_FLAGS="--force"
          else
            echo "📱 Using existing app"
            EXTRA_FLAGS=""
          fi
          
          # Run with verbose output for debugging
          shorebird release android \
            --flutter-version=3.24.0 \
            --verbose \
            $EXTRA_FLAGS || {
              echo ""
              echo "❌ Release failed!"
              echo "📋 Checking logs..."
              echo ""
              ls -la /home/runner/.config/shorebird/logs/ 2>/dev/null || true
              echo ""
              echo "📄 Last log file:"
              cat /home/runner/.config/shorebird/logs/*.log 2>/dev/null | tail -100 || true
              exit 1
            }
          
          echo ""
          echo "✅ Release completed successfully!"
          echo "🔗 Check status: https://console.shorebird.dev"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Patch
      - name: Shorebird Patch
        if: steps.build_type.outputs.type == 'patch'
        run: |
          echo "🔄 Starting Shorebird Patch..."
          echo "📱 App: phone_system_app"
          echo "🔧 Flutter Version: 3.24.0"
          echo "📦 Build Type: Patch"
          echo ""
          
          # Run with verbose output for debugging
          shorebird patch android \
            --flutter-version=3.24.0 \
            --verbose || {
              echo "❌ Patch failed!"
              echo "📋 Checking logs..."
              ls -la /home/runner/.config/shorebird/logs/ || true
              cat /home/runner/.config/shorebird/logs/*.log || true
              exit 1
            }
          
          echo ""
          echo "✅ Patch completed successfully!"
          echo "🔗 Check status: https://console.shorebird.dev"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Upload APK (only for full releases)
      - name: Upload APK
        if: steps.build_type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      # Create GitHub Release (only for full releases)
      - name: Create Release
        if: steps.build_type.outputs.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
