name: Shorebird Release

on:
  push:
    tags:
      - 'v*'  # للـ releases الكاملة
      - 'patch-*'  # للـ patches

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'  # Shorebird يدعم 3.24.0
      
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        # Retry on network failures
        continue-on-error: true
        id: shorebird_setup_attempt1
      
      - name: Retry Setup Shorebird (if first attempt failed)
        if: steps.shorebird_setup_attempt1.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
        continue-on-error: true
        id: shorebird_setup_attempt2
      
      - name: Final Retry Setup Shorebird (if second attempt failed)
        if: steps.shorebird_setup_attempt2.outcome == 'failure'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      
      - name: Verify Shorebird Installation
        run: shorebird --version
      
      - name: Shorebird Login
        run: shorebird login:ci
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      - name: Get dependencies
        run: flutter pub get
      
      # Create Shorebird app if needed (first time only)
      - name: Initialize Shorebird App
        run: |
          # Check if app_id is placeholder
          if grep -q "PLACEHOLDER_APP_ID" shorebird.yaml; then
            echo "📱 Creating new Shorebird app..."
            
            # Get app name from pubspec.yaml
            APP_NAME=$(grep "^name:" pubspec.yaml | cut -d' ' -f2)
            echo "App name: $APP_NAME"
            
            # Run shorebird init with app name
            # This creates the app and updates shorebird.yaml
            echo "$APP_NAME" | shorebird init --force
            
            # Verify app_id was created
            if grep -q "PLACEHOLDER_APP_ID" shorebird.yaml; then
              echo "❌ Failed to create app_id"
              exit 1
            fi
            
            NEW_APP_ID=$(grep "^app_id:" shorebird.yaml | cut -d' ' -f2)
            echo "✅ Created app with ID: $NEW_APP_ID"
            
            # Commit the updated shorebird.yaml back to repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add shorebird.yaml
            git commit -m "chore: Add Shorebird app_id [skip ci]" || true
            git push || echo "⚠️ Could not push app_id - will be in artifacts"
          else
            APP_ID=$(grep "^app_id:" shorebird.yaml | cut -d' ' -f2)
            echo "✅ Using existing app_id: $APP_ID"
          fi
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Check if it's a patch or full release
      - name: Determine build type
        id: build_type
        run: |
          if [[ $GITHUB_REF == refs/tags/patch-* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
      
      # Full release
      - name: Shorebird Release
        if: steps.build_type.outputs.type == 'release'
        run: |
          # Shorebird automatically creates app if app_id is empty
          echo "Building release..."
          shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Patch
      - name: Shorebird Patch
        if: steps.build_type.outputs.type == 'patch'
        run: shorebird patch android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      
      # Upload APK (only for full releases)
      - name: Upload APK
        if: steps.build_type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      
      # Create GitHub Release (only for full releases)
      - name: Create Release
        if: steps.build_type.outputs.type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
