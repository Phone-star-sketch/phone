name: Build with Shorebird

on:
  push:
    tags:
      - 'v*'  # أي tag يبدأ بـ v مثل: v1.0.0, v1.0.1, v2.0.0

jobs:
  build:
    name: Build APK with Shorebird
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4. Install Shorebird
      - name: Install Shorebird
        run: |
          curl -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash

      # 5. Get dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 6. Shorebird Release (يبني APK + يسجله على Shorebird)
      - name: Build with Shorebird
        run: |
          $HOME/.shorebird/bin/shorebird login --ci-token ${{ secrets.SHOREBIRD_TOKEN }}
          $HOME/.shorebird/bin/shorebird release android --force
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # 7. Rename APK
      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab \
               build/app/outputs/bundle/release/phone-system-app-v${VERSION}.aab
          fi
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk \
               build/app/outputs/flutter-apk/phone-system-app-v${VERSION}.apk
          fi

      # 8. Upload APK as Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-system-app-apk
          path: build/app/outputs/flutter-apk/phone-system-app-v*.apk
          if-no-files-found: warn

      # 9. Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/phone-system-app-v*.apk
            build/app/outputs/bundle/release/phone-system-app-v*.aab
          body: |
            ## 🎉 إصدار جديد - ${{ github.ref_name }}
            
            ### التحديثات:
            - ✅ تحديثات في الكود والـ UI
            - ✅ إصلاحات وتحسينات
            
            ### التثبيت:
            1. نزّل ملف APK
            2. افتحه على هاتفك
            3. اضغط "تثبيت"
            
            ---
            **ملاحظة:** بعد التثبيت، التحديثات القادمة هتكون تلقائية عن طريق Shorebird
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Success
      - name: Build Success
        run: |
          echo "✅ تم بناء APK بنجاح!"
          echo "📦 الإصدار: ${GITHUB_REF#refs/tags/}"
          echo "🚀 APK متاح في Artifacts و Releases"
